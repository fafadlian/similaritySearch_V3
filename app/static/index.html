<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Similarity Search</title>
  <!-- Link to external stylesheet via /static mount -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <!-- Optional future nav; placeholder -->
  </nav>
  <main>
    <h1>Passenger Similarity Search</h1>
    <form id="search-form">
      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" name="firstname" placeholder="e.g. John" required>
      </div>
      <div class="form-group">
        <label for="surname">Last Name</label>
        <input type="text" id="surname" name="surname" placeholder="e.g. Doe" required>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="Street address">
      </div>
      <div class="form-group">
        <label for="city_name">City</label>
        <input type="text" id="city_name" name="city_name" placeholder="City name">
      </div>
      <div class="form-group">
        <label for="sex">Sex</label>
        <select id="sex" name="sex">
          <option value="unknown">Unknown</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="nationality">Nationality</label>
        <input type="text" id="nationality" name="nationality" placeholder="Country code">
      </div>
      <div class="form-group">
        <label for="iata_o">Origin IATA</label>
        <input type="text" id="iata_o" name="iata_o" maxlength="3" placeholder="AAA">
      </div>
      <div class="form-group">
        <label for="iata_d">Destination IATA</label>
        <input type="text" id="iata_d" name="iata_d" maxlength="3" placeholder="BBB">
      </div>
      <div class="form-group">
        <label for="arrival_date_from">Arrival Date From</label>
        <input type="date" id="arrival_date_from" name="arrival_date_from" required>
      </div>
      <div class="form-group">
        <label for="arrival_date_to">Arrival Date To</label>
        <input type="date" id="arrival_date_to" name="arrival_date_to" required>
      </div>
      <div class="form-group">
        <label for="nameThreshold">Name Threshold (0–100)</label>
        <input type="number" id="nameThreshold" name="nameThreshold" min="0" max="100" value="0">
      </div>
      <div class="form-group">
        <label for="ageThreshold">Age Threshold</label>
        <input type="number" id="ageThreshold" name="ageThreshold" min="0" step="0.01" value="0">
      </div>
      <button type="submit" id="submit-btn">Search</button>
    </form>

    <section id="results"></section>
  </main>
  <footer>
    <!-- Footer placeholder -->
  </footer>
  <!-- Link to external JS via /static mount -->
  <script src="/static/js/script.js"></script>
</body>
</html>
